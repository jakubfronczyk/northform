# XcodeGen spec for the Swift shell (same tool as northform-ios; `just project` regenerates).
# Direct KMP integration per https://kotlinlang.org/docs/multiplatform/multiplatform-direct-integration.html
#   - run-script phase BEFORE Compile Sources (XcodeGen `preBuildScripts`)
#   - "Based on dependency analysis" OFF
#   - ENABLE_USER_SCRIPT_SANDBOXING = NO (Xcode defaults it ON; #1 cause of a failing first build)
name: Northform
options:
  bundleIdPrefix: com.jakubfronczyk
  deploymentTarget:
    iOS: "17.0"            # D15: CBConnectPeripheralOptionEnableAutoReconnect, CLBackgroundActivitySession, CLLocationUpdate
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "6.0"
    # Where :app:embedAndSignAppleFrameworkForXcode puts the framework (kotlinlang direct-integration page)
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Northform"

targets:
  Northform:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Widget/NorthformAttributes.swift   # shared with the widget: ActivityAttributes must be identical in both
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Northform
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Northform reads your heart rate from the Polar Verity Sense."
        NSLocationWhenInUseUsageDescription: "Northform records your route and distance while you run."
        NSSupportsLiveActivities: true
        CADisableMinimumFrameDurationOnPhone: true   # D13: lets Compose vote for 120 Hz
        UIBackgroundModes: [bluetooth-central, location]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubfronczyk.northform
        TARGETED_DEVICE_FAMILY: "1"
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # JAVA_HOME: Xcode's non-login shell doesn't see your zsh env. mise provides the JDK.
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
    dependencies:
      - target: NorthformWidget
        embed: true

  NorthformWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Northform
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubfronczyk.northform.widget   # 2nd App ID: counts toward the free team's 10/7-day and 3-apps-per-device caps (Q5)
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig

schemes:
  Northform:
    build:
      targets:
        Northform: all
    run:
      config: Debug
    test:
      config: Debug

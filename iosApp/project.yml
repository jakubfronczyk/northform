# XcodeGen spec for the Swift shell (same tool as northform-ios; `just project` regenerates).
# Direct KMP integration per https://kotlinlang.org/docs/multiplatform/multiplatform-direct-integration.html
#   - run-script phase BEFORE Compile Sources (XcodeGen `preBuildScripts`)
#   - "Based on dependency analysis" OFF
#   - ENABLE_USER_SCRIPT_SANDBOXING = NO (Xcode defaults it ON; #1 cause of a failing first build)
name: Northform
options:
  bundleIdPrefix: com.jakubfronczyk
  deploymentTarget:
    iOS: "18.0"            # D15 said 17 for CBConnectPeripheralOptionEnableAutoReconnect / CLBackgroundActivitySession,
                           # but `CLLocationUpdate.stationary` (D10's whole reason) is iOS 18+. The 16e ships iOS 18+. → amend D15 to 18.
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "6.0"

targets:
  Northform:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Widget/NorthformAttributes.swift   # shared with the widget: ActivityAttributes must be identical in both
      - path: ../replay/src/commonMain/resources/fixtures   # bundled replay fixtures (the simulator's run data); data only
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Northform
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Northform reads your heart rate from the Polar Verity Sense."
        NSLocationWhenInUseUsageDescription: "Northform records your route and distance while you run."
        NSSupportsLiveActivities: true
        CADisableMinimumFrameDurationOnPhone: true   # D13: lets Compose vote for 120 Hz
        UIBackgroundModes: [bluetooth-central, location]
        # Documents/Recordings (debug run fixtures) shows up in the Files app under "Northform" and can be copied off.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubfronczyk.northform
        TARGETED_DEVICE_FAMILY: "1"
        # The Kotlin framework's Swift module is `Northform`. If the app target's module had the same
        # name, `import Northform` would silently resolve to the app itself and every Kotlin type would
        # fail with "Cannot find type … in scope". Display/product name stays Northform.
        PRODUCT_NAME: Northform
        PRODUCT_MODULE_NAME: NorthformIOS
        # Only the APP links the Kotlin framework; the widget must not (it's pure SwiftUI, D16).
        # The framework is DYNAMIC (app/build.gradle.kts) and Xcode embeds + signs it like any other
        # framework (`dependencies` below, via the stable `current` symlink the script maintains). The script
        # declares the framework as its output, so Xcode's copy + re-sign wait for it and run whenever the Kotlin
        # changed. Why not the usual static framework + embedAndSign: ld records no dependency on a static
        # archive, so Xcode never relinked after a Kotlin-only change and the phone kept the previous Kotlin until
        # the next build; and a dylib swapped in by Gradle leaves the app's seal invalid (2026-10-07).
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../app/build/xcode-frameworks/current $(inherited)"
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../app/build/xcode-frameworks/current/Northform.framework/Northform
        script: |
          set -e
          cd "$SRCROOT/.."
          # JAVA_HOME: Xcode's non-login shell doesn't see your zsh env. mise provides the JDK.
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          # Build (not embed) the framework for this configuration and SDK into app/build/xcode-frameworks/<config>/<sdk>.
          case "$SDK_NAME" in iphonesimulator*) TARGET=IosSimulatorArm64 ;; *) TARGET=IosArm64 ;; esac
          ./gradlew ":app:assemble${CONFIGURATION}AppleFrameworkForXcode${TARGET}"
          # Stable path for Xcode to link and embed from (FRAMEWORK_SEARCH_PATHS + dependencies). A real copy, not a
          # symlink: Xcode pre-creates the declared output's directory, and `ln` into an existing directory nests.
          mkdir -p app/build/xcode-frameworks/current/Northform.framework
          rsync -a --delete "app/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/Northform.framework/" app/build/xcode-frameworks/current/Northform.framework/
    dependencies:
      - target: NorthformWidget
        embed: true
      # The Kotlin framework: linked, embedded and signed by Xcode.
      - framework: ../app/build/xcode-frameworks/current/Northform.framework
        embed: true

  NorthformWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Northform
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakubfronczyk.northform.widget   # 2nd App ID: counts toward the free team's 10/7-day and 3-apps-per-device caps (Q5)
    configFiles:
      Debug: Configuration/Local.xcconfig
      Release: Configuration/Local.xcconfig

schemes:
  Northform:
    build:
      targets:
        Northform: all
    run:
      config: Debug
    test:
      config: Debug
